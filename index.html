<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xcortex | NFC Deep Scan</title>
<style>
    :root { --bg: #0a0b10; --accent: #0fb3a6; --text: #fff; --muted: #8b9bb4; --danger: #ff5a2c; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { 
        background-color: var(--bg); color: var(--text); min-height: 100vh; 
        display: flex; align-items: center; justify-content: center; overflow-x: hidden;
    }
    .container { text-align: center; padding: 20px; width: 100%; max-width: 450px; }
    
    h1 { font-size: 2rem; margin-bottom: 10px; letter-spacing: -1px; }
    h1 span { color: var(--accent); }
    p.desc { color: var(--muted); font-size: 0.9rem; margin-bottom: 30px; line-height: 1.5; }

    #scan-btn {
        width: 100%; padding: 20px; background: linear-gradient(135deg, #00bcd4, #006064);
        border: none; border-radius: 16px; color: white; font-size: 1.2rem; font-weight: 700;
        cursor: pointer; box-shadow: 0 10px 30px rgba(0, 188, 212, 0.3); transition: all 0.3s ease;
        position: relative; overflow: hidden;
    }
    #scan-btn:hover { transform: translateY(-3px); }
    #scan-btn.scanning { background: #333; color: #aaa; pointer-events: none; animation: pulseBg 2s infinite; }

    @keyframes pulseBg { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

    /* Блок результатов */
    #result-area {
        margin-top: 30px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px; padding: 20px; display: none; text-align: left; word-break: break-all;
        font-family: monospace; font-size: 0.85rem; max-height: 60vh; overflow-y: auto;
    }
    
    .row { margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
    .label { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; margin-bottom: 5px; display: block; }
    .value { color: var(--accent); font-size: 1.1rem; font-weight: bold; }
    .raw-json { color: #ccc; font-size: 0.75rem; white-space: pre-wrap; margin-top: 10px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; }

    .error-msg { color: var(--danger); font-weight: bold; margin-top: 20px; display: none; }
</style>
</head>
<body>

<div class="container">
    <h1>X<span>cortex</span></h1>
    <p class="desc">Deep NFC Scanner.<br>Покажет UID и все технические данные метки.</p>

    <button id="scan-btn" onclick="startScan()">📲 НАЧАТЬ ГЛУБОКОЕ СКАНИРОВАНИЕ</button>

    <div id="error-msg" class="error-msg"></div>

    <div id="result-area">
        <div class="row">
            <span class="label">Статус:</span>
            <span class="value" id="res-status">Успех</span>
        </div>
        <div class="row">
            <span class="label">UID (Серийный номер):</span>
            <span class="value" id="res-uid">---</span>
        </div>
        <div class="row">
            <span class="label">Тип технологии:</span>
            <span class="value" id="res-tech">---</span>
        </div>
        <div class="row">
            <span class="label">Количество NDEF записей:</span>
            <span class="value" id="res-count">0</span>
        </div>
        
        <!-- Сюда выведем полный JSON ответа, чтобы увидеть всё -->
        <div class="row">
            <span class="label">Полные данные объекта (JSON):</span>
            <pre class="raw-json" id="res-full">Загрузка...</pre>
        </div>
    </div>
</div>

<script>
    const btn = document.getElementById('scan-btn');
    const resultArea = document.getElementById('result-area');
    const errorMsg = document.getElementById('error-msg');
    let reader = null;

    async function startScan() {
        // Проверка поддержки
        if (!('NDEFReader' in window)) {
            showError("❌ Браузер не поддерживает Web NFC.");
            return;
        }

        btn.classList.add('scanning');
        btn.innerText = "⏳ ЖДЕМ МЕТКУ...";
        resultArea.style.display = 'none';
        errorMsg.style.display = 'none';

        try {
            reader = new NDEFReader();
            
            // Запускаем сканирование
            await reader.scan();
            console.log("Scanning active...");

            // Слушаем событие чтения
            reader.addEventListener("reading", ({ serialNumber, records }) => {
                console.log("RAW DATA RECEIVED:", { serialNumber, records });
                
                btn.classList.remove('scanning');
                btn.innerText = "✅ ДАННЫЕ ПОЛУЧЕНЫ";
                
                // 1. Выводим UID
                document.getElementById('res-uid').innerText = serialNumber || "Не определен";
                
                // 2. Пытаемся определить технологию по структуре records или просто пишем неизвестно
                // В Web NFC API нет прямого поля "technology", его нужно эвристически определять или брать из других источников.
                // Для демо напишем стандарт для карт:
                document.getElementById('res-tech').innerText = records && records.length > 0 ? "NDEF Format" : "Raw Tag / EMV Card";

                // 3. Количество записей
                const count = records ? records.length : 0;
                document.getElementById('res-count').innerText = count;

                // 4. Полный дамп данных в JSON
                // Мы преобразуем Uint8Array в обычный массив чисел, чтобы JSON.stringify работал
                const safeRecords = records ? records.map(r => ({
                    type: r.recordType,
                    encoding: r.encoding,
                    data: Array.from(r.data) // Превращаем байты в массив чисел [1, 2, 3...]
                })) : [];

                const fullData = {
                    uid: serialNumber,
                    recordCount: count,
                    records: safeRecords
                };

                document.getElementById('res-full').innerText = JSON.stringify(fullData, null, 2);
                
                resultArea.style.display = 'block';
            });

            // Ошибки чтения
            reader.addEventListener("readingerror", () => {
                showError("⚠️ Ошибка чтения. Попробуйте сильнее прижать карту.");
                resetButton();
            });

        } catch (err) {
            console.error(err);
            showError(`Ошибка: ${err.message}. Проверьте настройки NFC.`);
            resetButton();
        }
    }

    function resetButton() {
        btn.classList.remove('scanning');
        btn.innerText = "📲 НАЧАТЬ ГЛУБОКОЕ СКАНИРОВАНИЕ";
    }

    function showError(msg) {
        errorMsg.innerText = msg;
        errorMsg.style.display = 'block';
        resetButton();
    }
</script>

</body>
</html>
